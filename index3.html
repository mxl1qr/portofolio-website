<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capsule Navbar Demo</title>
    <style>
        /* =========================================
       1. CSS VARIABLES & RESET
       ========================================= */
        :root {
            --bg: #fafafa;
            --text: #09090b;
            --text-muted: #71717a;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --nav-border: rgba(228, 228, 231, 0.9);
            --nav-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --btn-bg: #09090b;
            --btn-text: #ffffff;
            --btn-hover: #27272a;
            --indicator: #09090b;
            --theme-btn-bg: rgba(244, 244, 245, 0.9);
            --theme-btn-border: #e4e4e7;
        }

        /* Dark Mode Variables */
        html.dark {
            --bg: #09090b;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --nav-bg: rgba(9, 9, 11, 0.85);
            --nav-border: rgba(39, 39, 42, 0.9);
            --nav-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            --btn-bg: #f4f4f5;
            --btn-text: #09090b;
            --btn-hover: #e4e4e7;
            --indicator: #ffffff;
            --theme-btn-bg: rgba(24, 24, 27, 0.8);
            --theme-btn-border: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 250vh;
            /* Hanya agar halaman bisa di-scroll */
        }

        /* =========================================
       2. HEADER & CAPSULE NAVBAR STYLING
       ========================================= */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            pointer-events: none;
            /* Klik tembus kecuali elemen navbar */
        }

        /* Container pembungkus luar */
        .nav-container {
            margin: 0 auto;
            max-width: 1150px;
            padding: 0 32px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Navbar Utama */
        .navbar {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
            padding: 0;
            background: transparent;
            border-bottom: 1px solid transparent;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* =========================================
       3. STATE SAAT DI-SCROLL (JADI KAPSUL)
       ========================================= */
        .nav-container.is-scrolled {
            max-width: 890px;
            padding: 0 16px;
            padding-top: 16px;
            /* Memberi jarak melayang dari atas layar */
        }

        .nav-container.is-scrolled .navbar {
            height: 64px;
            padding: 0 24px;
            border-radius: 9999px;
            /* MEMBUAT BENTUK KAPSUL / PIL */
            background: var(--nav-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--nav-border);
            box-shadow: var(--nav-shadow);
        }

        /* =========================================
       4. LOGO [ AM. ]
       ========================================= */
        .logo {
            display: flex;
            align-items: center;
            gap: 3px;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 1.125rem;
            letter-spacing: 0.05em;
        }

        .logo .bracket {
            font-family: monospace;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .logo:hover .bracket {
            color: var(--text);
        }

        /* =========================================
       5. NAV LINKS & ACTIVE INDICATOR
       ========================================= */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }

        .nav-link {
            position: relative;
            display: block;
            padding: 6px 14px;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--text);
        }

        .nav-link.active {
            color: var(--text);
            font-weight: 600;
        }

        /* Garis indikator di bawah menu aktif */
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 8px;
            right: 8px;
            height: 2px;
            background: var(--indicator);
            border-radius: 9999px;
            transition: all 0.25s ease;
        }

        /* =========================================
       6. ACTIONS (THEME TOGGLE & CTA BUTTON)
       ========================================= */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tombol Switch Theme */
        .theme-toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--theme-btn-border);
            background: var(--theme-btn-bg);
            color: var(--text);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-container.is-scrolled .theme-toggle-btn {
            border-radius: 9999px;
            /* Jadi bulat penuh saat navbar jadi kapsul */
            width: 36px;
            height: 36px;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.05);
        }

        .theme-toggle-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2;
        }

        /* Tampilkan icon sesuai mode */
        .sun-icon {
            display: none;
            color: #fbbf24;
        }

        .moon-icon {
            display: block;
            color: var(--text-muted);
        }

        html.dark .sun-icon {
            display: block;
        }

        html.dark .moon-icon {
            display: none;
        }

        /* Tombol Get in Touch (CTA) */
        .btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 40px;
            padding: 0 18px;
            border-radius: 12px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .nav-container.is-scrolled .btn-cta {
            border-radius: 9999px;
            /* Jadi kapsul saat di-scroll */
            height: 36px;
            padding: 0 16px;
            font-size: 0.8rem;
        }

        .btn-cta:hover {
            background-color: var(--btn-hover);
            transform: translateY(-1px);
        }

        .btn-cta svg {
            width: 15px;
            height: 15px;
            transition: transform 0.2s ease;
        }

        .btn-cta:hover svg {
            transform: translate(2px, -2px);
        }

        /* Konten Demo Bawah */
        .demo-content {
            padding-top: 140px;
            max-width: 800px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            text-align: center;
        }

        section {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <!-- =========================================
       HEADER / NAVBAR
       ========================================= -->
    <header>
        <div id="navContainer" class="nav-container">
            <div class="navbar">

                <!-- 1. Logo Monogram -->
                <a href="#home" class="logo">
                    <span class="bracket">[</span>
                    <span>AM.</span>
                    <span class="bracket">]</span>
                </a>

                <!-- 2. Navigation Links -->
                <ul class="nav-links">
                    <li><a href="#home" class="nav-link active">Home</a></li>
                    <li><a href="#about" class="nav-link">About</a></li>
                    <li><a href="#projects" class="nav-link">Projects</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>

                <!-- 3. Actions (Theme Switcher & Get in Touch Button) -->
                <div class="nav-actions">

                    <!-- Tombol Switch Theme -->
                    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
                        <!-- Icon Sun (Mode Gelap -> klik untuk Terang) -->
                        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2"></path>
                            <path d="M12 20v2"></path>
                            <path d="m4.93 4.93 1.41 1.41"></path>
                            <path d="m17.66 17.66 1.41 1.41"></path>
                            <path d="M2 12h2"></path>
                            <path d="M20 12h2"></path>
                            <path d="m6.34 17.66-1.41 1.41"></path>
                            <path d="m19.07 4.93-1.41 1.41"></path>
                        </svg>
                        <!-- Icon Moon (Mode Terang -> klik untuk Gelap) -->
                        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>

                    <!-- Tombol Get In Touch -->
                    <a href="#contact" class="btn-cta">
                        <span>Get in Touch</span>
                        <!-- Icon Arrow Up Right (↗) -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </a>

                </div>

            </div>
        </div>
    </header>

    <!-- Konten Dummy untuk Test Scroll -->
    <main class="demo-content">
        <section id="home">
            <h1>Halo! Scroll ke bawah 👇</h1>
            <p style="margin-top: 10px; color: var(--text-muted);">
                Perhatikan navbar di atas akan mengecil dan berubah menjadi kapsul melayang.
            </p>
        </section>
        <section id="about">
            <h2>Section About</h2>
        </section>
        <section id="projects">
            <h2>Section Projects</h2>
        </section>
        <section id="contact">
            <h2>Section Contact</h2>
        </section>
    </main>

    <!-- =========================================
       7. JAVASCRIPT LOGIC
       ========================================= -->
    <script>
        // --- A. Logika Scroll Jadi Kapsul ---
        const navContainer = document.getElementById('navContainer');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 40) {
                navContainer.classList.add('is-scrolled');
            } else {
                navContainer.classList.remove('is-scrolled');
            }
        });

        // --- B. Logika Switch Theme (Dark / Light Mode) ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        // Cek tema tersimpan di localStorage
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            htmlElement.classList.remove('dark');
        } else {
            htmlElement.classList.add('dark'); // Default dark
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // --- C. Logika Auto Active Nav Link Saat Scroll ---
        const sections = document.querySelectorAll('section');
        const navLinks = document.querySelectorAll('.nav-link');

        window.addEventListener('scroll', () => {
            let currentSection = '';
            const scrollPos = window.scrollY + 140;

            sections.forEach(section => {
                const top = section.offsetTop;
                const height = section.offsetHeight;
                if (scrollPos >= top && scrollPos < top + height) {
                    currentSection = section.getAttribute('id');
                }
            });

            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === `#${currentSection}`) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>

</html>
